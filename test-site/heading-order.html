<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A page whose outline starts at the second level</title>
<meta name="description" content="The first heading in the markup is an H2, and the H1 that says what the page is about comes after it.">
</head>
<body>
<h2>A section heading before the page has said what it is</h2>
<p>The outline a reader walks starts here, one level down from where it should.</p>
<h1>Heading order</h1>
<p>The H1 arrives after the first section, so the document reads as a fragment of
some larger page that was never served.</p>
