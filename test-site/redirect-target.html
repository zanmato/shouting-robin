<title>Redirect Target Page Reached Only Through A Redirect</title>
<meta name="description" content="This page is linked from nowhere; the only way in is the 301 on /moved.">

<body>
<h1>Redirect Target</h1>
<h2>Reached only through the redirect</h2>
<p>Nothing links here. A crawler that cannot read the Location header of /moved never sees this page at all.</p>
</body>
