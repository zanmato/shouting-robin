<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A page with no body element</title>
<meta name="description" content="Markup that goes from the head straight into content, the way a JavaScript shell often does.">
</head>
<h1>No body tag here</h1>
<p>A browser invents a body element and renders this anyway, which is how a page
like this ships without anyone noticing. Everything else that reads the page is
recovering from the same omission in its own way.</p>
