[workspace]
members = [
    "crates/shoutingrobin",
    "crates/gpui_tokio",
    "crates/ui",
    "crates/vsx-themes",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
authors = ["Andreas Johansson <z@zanmato.se>"]
license = "Apache-2.0"
homepage = "https://github.com/zanmato/shouting-robin"
repository = "https://github.com/zanmato/shouting-robin"
description = "Ecommerce-first SEO crawler"
publish = false

[workspace.dependencies]
# Core GPUI dependencies
# The GPUI facade: one dependency for GPUI itself, the platform layer and the
# component library, all reachable under `gpui_kit::`.
gpui-kit = { version = "0.8.0", features = ["tree-sitter-html"] }
# For crates written against GPUI and gpui-component by name (vsx-themes,
# shared with Blanco and Broquest). The same packages and versions GPUI Kit
# uses, so they are the ones it builds, gpui-pre included through the patch
# below.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# The features GPUI Kit's `tree-sitter-html` turns on, so a crate built on its
# own (`cargo test -p vsx-themes`) gets the same gpui-component as the app.
# Without `tree-sitter` gpui-component compiles a stub highlighter whose
# theme keys differ.
gpui-component = { version = "0.8.0", features = ["tree-sitter-html"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-async-std",
    "sqlite",
    "chrono",
    "json",
] }

# Core
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
chrono = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
smol = "2.0"
dirs = "5"
url = "2"
flume = "0.11"

# Async runtime bridge
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }

# Crawl backend
spider = { git = "https://github.com/zanmato/spider", branch = "shouting-robin", default-features = false, features = [
    "chrome",
    "chrome_intercept",
    "chrome_stealth",
    "chrome_store_page",
    "sync",
    "sitemap",
    "regex",
    "serde",
    "time",
    "headers",
] }

# HTML parsing
scraper = "0.21"

# Hashing
md5 = "0.7"

# XML parsing
quick-xml = "0.37"
flate2 = "1"

tempfile = "3"

# HTTP client (reuse from spider's dep tree)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }

# GPUI Kit reaches GPUI through the gpui-pre snapshots on crates.io. These
# stand-ins carry the same names and the version GPUI Kit pins, and re-export
# gpui-fast, so the revision has to move together with the gpui-kit version
# above: gpui-fast v0.1.10 stands in for the gpui-pre 0.3.9 that GPUI Kit 0.8.0
# pins. GPUI Kit's own `gpui-fast` feature is not used because it still builds
# gpui-pre next to gpui-fast.
[patch.crates-io]
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-web = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
redundant_clone = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
if_not_else = "warn"

[profile.release]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
