[package]
name = "shoutingrobin"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "shoutingrobin"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui_platform = { workspace = true }
gpui_tokio = { path = "../gpui_tokio" }
shoutingrobin-ui = { path = "../ui" }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
smol = { workspace = true }
dirs = { workspace = true }
rust-embed = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
flume = { workspace = true }
tokio = { workspace = true }

spider = { workspace = true }
scraper = { workspace = true }
csv = "1"
md5 = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
ego-tree = "0.9.0"

# Self-update via GitHub releases
self_update = { version = "0.42", default-features = false, features = [
  "rustls",
  "archive-tar",
  "compression-flate2",
] }
semver = "1.0"
# The PDF report. takumi-pdf is not published to crates.io, so all three come
# from one pinned revision of the repository: the facade crate on crates.io
# would bring a second, incompatible copy of takumi-core, and the `Fonts` a
# render takes has to be the one takumi-pdf was built against.
takumi-pdf = { git = "https://github.com/kane50613/takumi", rev = "871f534c6080933577014e3562296f1564fa77d1" }
takumi-core = { git = "https://github.com/kane50613/takumi", rev = "871f534c6080933577014e3562296f1564fa77d1" }
takumi-html = { git = "https://github.com/kane50613/takumi", rev = "871f534c6080933577014e3562296f1564fa77d1" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
sqlx = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"
