      sv: "Se till att element markerade som presentation inte har globala ARIA-attribut eller tabindex, så att alla skärmläsare ignorerar dem"
    region:
      en: "Ensure all page content is contained by landmarks"
      sv: "Se till att allt innehåll på sidan ligger i landmärken"
    scope_attr_valid:
      en: "Ensure the scope attribute is used correctly on tables"
      sv: "Se till att scope-attributet används korrekt i tabeller"
    skip_link:
      en: "Ensure all skip links have a focusable target"
      sv: "Se till att alla hopplänkar har ett mål som kan få fokus"
    tabindex:
      en: "Ensure tabindex attribute values are not greater than 0"
      sv: "Se till att tabindex-värden inte är större än 0"
    table_duplicate_name:
      en: "Ensure the <caption> element does not contain the same text as the summary attribute"
      sv: "Se till att <caption>-elementet inte innehåller samma text som summary-attributet"
    color_contrast_enhanced:
      en: "Ensure the contrast between foreground and background colors meets WCAG 2 AAA enhanced contrast ratio thresholds"
      sv: "Se till att kontrasten mellan förgrunds- och bakgrundsfärger når WCAG 2 AAA:s förhöjda kontrastkvoter"
    identical_links_same_purpose:
      en: "Ensure that links with the same accessible name serve a similar purpose"
      sv: "Se till att länkar med samma tillgängliga namn har liknande syfte"
    meta_refresh_no_exceptions:
      en: "Ensure <meta http-equiv=\"refresh\"> is not used for delayed refresh"
      sv: "Se till att <meta http-equiv=\"refresh\"> inte används för fördröjd uppdatering"
    css_orientation_lock:
      en: "Ensure content is not locked to any specific display orientation, and the content is operable in all display orientations"
      sv: "Se till att innehållet inte är låst till en viss skärmorientering och att det går att använda i alla orienteringar"
    focus_order_semantics:
      en: "Ensure elements in the focus order have a role appropriate for interactive content"
      sv: "Se till att element i fokusordningen har en roll som passar interaktivt innehåll"
    hidden_content:
      en: "Inform users about hidden content."
      sv: "Informera användare om dolt innehåll."
    label_content_name_mismatch:
      en: "Ensure that elements labelled through their content must have their visible text as part of their accessible name"
      sv: "Se till att element som får sin etikett från sitt innehåll har sin synliga text som en del av sitt tillgängliga namn"
    p_as_heading:
      en: "Ensure bold, italic text and font-size is not used to style <p> elements as a heading"
      sv: "Se till att fet eller kursiv text och teckenstorlek inte används för att få <p>-element att se ut som rubriker"
    table_fake_caption:
      en: "Ensure that tables with a caption use the <caption> element."
      sv: "Se till att tabeller med bildtext använder <caption>-elementet."
    td_has_header:
      en: "Ensure that each non-empty data cell in a <table> larger than 3 by 3 has one or more table headers"
      sv: "Se till att varje datacell som inte är tom i en <table> större än 3 gånger 3 har en eller flera tabellrubriker"
    aria_roledescription:
      en: "Ensure aria-roledescription is only used on elements with an implicit or explicit role"
      sv: "Se till att aria-roledescription bara används på element med en implicit eller explicit roll"
    audio_caption:
      en: "Ensure <audio> elements have captions"
      sv: "Se till att <audio>-element har textning"
    duplicate_id_active:
      en: "Ensure every id attribute value of active elements is unique"
      sv: "Se till att varje id-värde på aktiva element är unikt"
    duplicate_id:
      en: "Ensure every id attribute value is unique"
      sv: "Se till att varje id-värde är unikt"
    landmark_complementary_is_top_level:
      en: "Ensure the complementary landmark or aside is at top level"
      sv: "Se till att complementary-landmärket eller aside ligger på översta nivån"
